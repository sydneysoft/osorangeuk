name: Publish Signed OrangeSoft Browser Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require macOS signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required macOS signing secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run js:build

      - name: Build styles
        run: npm run sass

      - name: Build, sign and notarize macOS demo
        run: npx electron-builder --mac dmg --publish never --config.forceCodeSigning=true --config.mac.notarize=true

      - name: Verify macOS signature and notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          app="$(find dist -type d -name 'OrangeSoft Browser.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Rename macOS demo
        shell: bash
        run: |
          set -euo pipefail
          file="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$file"
          cp "$file" OrangeSoft-Browser-Demo-macOS.dmg

      - name: Upload macOS demo
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: OrangeSoft-Browser-Demo-macOS.dmg

  build-windows:
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require Windows signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw "Missing required Windows signing secret: WIN_CSC_LINK"
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "Missing required Windows signing secret: WIN_CSC_KEY_PASSWORD"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run js:build

      - name: Build styles
        run: npm run sass

      - name: Build and sign Windows demo
        run: npx electron-builder --win nsis --publish never --config.forceCodeSigning=true

      - name: Verify Windows Authenticode signature
        shell: pwsh
        run: |
          $file = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $file) { throw "No Windows installer found" }
          $signature = Get-AuthenticodeSignature $file.FullName
          if ($signature.Status -ne "Valid") {
            throw "Windows installer signature is not valid. Status: $($signature.Status)"
          }
          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"

      - name: Rename Windows demo
        shell: pwsh
        run: |
          $file = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $file) { throw "No Windows installer found" }
          Copy-Item $file.FullName OrangeSoft-Browser-Demo-Windows.exe

      - name: Upload Windows demo
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: OrangeSoft-Browser-Demo-Windows.exe

  release:
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download macOS demo
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release

      - name: Download Windows demo
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: Publish signed demo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: OrangeSoft Browser Demo
          body: |
            OrangeSoft Browser demo for macOS and Windows.

            The macOS build is Developer ID signed and notarized.
            The Windows installer is Authenticode signed.

            Demo features include browser tabs, favorites, history, native-language word translation, StoryLingo saved vocabulary, first-run onboarding, and account settings.
          files: |
            release/OrangeSoft-Browser-Demo-macOS.dmg
            release/OrangeSoft-Browser-Demo-Windows.exe
          make_latest: true
