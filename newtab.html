<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>New Tab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f7f7f7;
  color: #111;
}

.container {
  width: min(680px, 85%);
  text-align: center;
}

.logo {
  font-size: 52px;
  margin-bottom: 8px;
}

h1 {
  margin: 0 0 32px;
  font-size: 34px;
}

.search {
  width: 100%;
  height: 52px;
  border-radius: 26px;
  border: 1px solid #d0d0d0;
  padding: 0 22px;
  font-size: 17px;
  outline: none;
  background: white;
}

.search:focus {
  border-color: #999;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.footer {
  margin-top: 28px;
  color: #888;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">🍊</div>

  <h1>OrangeSoft</h1>

  <input
    id="search"
    class="search"
    placeholder="Search the web or enter an address"
    autofocus
  >

  <div class="footer">
    OrangeSoft Browser
  </div>
</div>

<script>
const search = document.getElementById('search');

search.addEventListener('keydown', event => {
  if (event.key !== 'Enter') return;

  const value = search.value.trim();

  if (!value) return;

  let target;

  if (
    value.includes('.') &&
    !value.includes(' ')
  ) {
    target = /^https?:\/\//i.test(value)
      ? value
      : 'https://' + value;
  } else {
    target =
      'https://www.google.com/search?q=' +
      encodeURIComponent(value);
  }

  window.location.href = target;
});
</script>

</body>
</html>
